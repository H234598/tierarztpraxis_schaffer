name: E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      SITE_DEPLOYMENT_MODE: development
      ALLOW_PLACEHOLDERS: "true"
      ALLOW_TURNSTILE_TEST_KEYS: "true"
      PUBLIC_SITE_URL: http://127.0.0.1:4321
      PUBLIC_BASE_PATH: /
      PUBLIC_CONTACT_API_URL: https://api.tierarztpraxis-schaffer.telacore.org/v1/contact
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node.js mit pnpm-Cache einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Abhängigkeiten reproduzierbar installieren
        run: pnpm install --frozen-lockfile

      - name: Chromium installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-End-Tests ausführen
        run: pnpm test:e2e

      - name: Fehlerartefakte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 5
          if-no-files-found: ignore
